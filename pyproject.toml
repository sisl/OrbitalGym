[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbital-game"
version = "0.1.0"
description = "JAX-native framework for guard/bandit decision-making in orbital scenarios"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Duncan Eddy"}]
dependencies = [
    "jax>=0.9.2",
    "jaxlib>=0.9.2",
    "flax>=0.12.6",
    "chex>=0.1.91",
    "gymnax>=0.0.9",
    "gymnasium>=1.2",
    "pettingzoo>=1.26",
    "mctx>=0.0.6",
    "astrojax>=0.7.2",
    "brahe>=1.5.0",
    "h5py>=3.16",
    "matplotlib>=3.10",
    "scienceplots>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.8",
    "ruff>=0.15",
    "pyrefly>=0.61",
    "pre-commit>=4.6",
    "nbconvert>=7.17",
    "ipykernel>=7.2",
    "ipywidgets>=8.1",
    "ipympl>=0.9",
    "zensical>=0.0.39",
    "mkdocstrings-python>=2.0.3",
]
cuda12 = [
    "jax[cuda12]>=0.9.2",
]
cuda13 = [
    "jax[cuda13]>=0.9.2",
]
mps = [
    "jax-mps>=0.9.13",
]
extras = [
    "cvxpy>=1.8.2",
    "highspy>=1.14.0",
]
# Kept (empty) for backward compat — brahe is now a core dependency.
ground-stations = []

[tool.hatch.build.targets.wheel]
packages = ["src/orbital_game"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks use interactive-code conventions (semicolon-chained statements,
# combined imports) that don't apply to library/test code. Lint the .py files
# only; users can format notebooks with `jupyter nbconvert --to notebook
# --execute` or in the editor.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "PYI"]

[tool.ruff.lint.per-file-ignores]
# Notebook generator: long lines are notebook cell source — not library code.
"make_attitude_notebooks.py" = ["E501"]

[tool.pyrefly]
project-includes = ["src/orbital_game"]
project-excludes = ["src/orbital_game/viz", "src/orbital_game/logging"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "pytest>=9.0.3",
]
