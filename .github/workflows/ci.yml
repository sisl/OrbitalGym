name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync environment
        run: uv sync --extra dev --extra docs

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run pyrefly check src/orbital_game

      - name: Test
        run: uv run pytest -n auto -v

      - name: Build docs
        run: uv run zensical build --strict
