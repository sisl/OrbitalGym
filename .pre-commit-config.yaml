# Pre-commit hooks for OrbitalGym.
#
# Install once after `uv sync --extra dev`:
#     uv run pre-commit install
#
# All hooks are `local` and shell out to `uv run` so tool versions stay
# pinned by uv.lock (single source of truth) instead of being duplicated
# here.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (with auto-fix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pyrefly
        name: pyrefly (whole-project type check)
        entry: uv run pyrefly check src/orbitalgym
        language: system
        pass_filenames: false
        require_serial: true
